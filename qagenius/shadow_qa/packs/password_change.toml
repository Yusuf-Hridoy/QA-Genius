id = "password_change"
name = "Password change"
short = "Password"
triggers = ["change password", "changes password", "changing password", "change the password", "update password", "updates password", "updating password", "updating passwords", "new password", "reset password", "password reset", "password strength", "strength criteria", "password policy"]
exclude = []

[[checks]]
id = "wrong_current"
title = "A wrong current password is rejected"
severity = "high"
why = "Without it, anyone who finds an unlocked laptop owns the account for good."
covered_if = ["current password", "existing password", "old password", "re-enter", "reauthenticate", "re-authenticate", "reauthentication", "re-authentication"]
  [checks.test]
  title = "Changing the password with the wrong current password is refused"
  category = "Negative"
  priority = "High"
  pre_conditions = "A user is signed in as user@example.com"
  steps = ["Open the change-password form", "Type a wrong value in the current password field", "Type a valid new password twice and save"]
  expected_result = "The save is refused with a message naming the current password, and the old password still signs the user in."
  test_data = "current=WrongPass123, new=Harbour-Lantern-42"

[[checks]]
id = "same_as_old"
title = "A new password equal to the old one is rejected"
severity = "medium"
why = "A change that changes nothing still ends the alert, so a leaked password stays live."
covered_if = ["same as", "equal to the old", "reuse", "re-use", "previous password", "password history"]
  [checks.test]
  title = "Saving the current password as the new password is refused"
  category = "Negative"
  priority = "Medium"
  pre_conditions = "A user is signed in as user@example.com with the password Harbour-Lantern-42"
  steps = ["Open the change-password form", "Enter Harbour-Lantern-42 as the current password", "Enter Harbour-Lantern-42 as the new password and the confirmation, then save"]
  expected_result = "The save is refused with a message saying the new password must be different; the password is unchanged."
  test_data = "current=Harbour-Lantern-42, new=Harbour-Lantern-42"

[[checks]]
id = "confirm_mismatch"
title = "A confirmation that does not match blocks the save"
severity = "medium"
why = "A typo in a field nobody can read locks the owner out of their own account."
covered_if = ["confirm", "confirmation", "do not match", "does not match", "mismatch", "repeat password"]
  [checks.test]
  title = "A mismatched confirmation field blocks the save"
  category = "Negative"
  priority = "Medium"
  pre_conditions = "A user is signed in as user@example.com"
  steps = ["Open the change-password form and enter the correct current password", "Enter Harbour-Lantern-42 as the new password", "Enter Harbour-Lantern-43 as the confirmation and save"]
  expected_result = "The save is refused, the mismatch is named next to the confirmation field, and the old password still works."
  test_data = "new=Harbour-Lantern-42, confirm=Harbour-Lantern-43"

[[checks]]
id = "length_boundary"
title = "Length boundary: one below the minimum and exactly the minimum"
severity = "high"
why = "Off-by-one here either blocks a valid password or lets a short one through."
covered_if = ["minimum length", "min length", "characters long", "too short", "shortest", "boundary"]
  [checks.test]
  title = "A password one character below the minimum is refused and the minimum is accepted"
  category = "Boundary"
  priority = "High"
  pre_conditions = "A user is signed in as user@example.com and the minimum length is the one stated in the criteria"
  steps = ["Enter a new password one character shorter than the minimum and save", "Enter a new password of exactly the minimum length and save", "Sign out and sign in with the accepted password"]
  expected_result = "The short password is refused with the minimum named in the message; the exact-minimum password saves and signs the user in."
  test_data = "minimum from the criteria; try minimum minus 1 characters, then minimum characters"

[[checks]]
id = "other_sessions_out"
title = "Other sessions are signed out after the change"
severity = "high"
why = "Changing a password is what people do after a theft; leaving the thief signed in defeats the whole act."
covered_if = ["other sessions", "all sessions", "sign out everywhere", "log out everywhere", "revoke", "other devices"]
  [checks.test]
  title = "A session on another device stops working after the password changes"
  category = "Functional"
  priority = "High"
  pre_conditions = "The same account is signed in on two browsers, A and B"
  steps = ["In browser A, change the password successfully", "In browser B, reload a page that needs a signed-in user", "In browser B, call one API endpoint with the session token it still holds"]
  expected_result = "Browser B is sent to the sign-in page and its old token is refused by the API; browser A stays signed in."
  test_data = "two browser profiles signed in as user@example.com"

[[checks]]
id = "never_in_logs"
title = "The password never appears in a URL, log or error message"
severity = "high"
why = "A password in a query string ends up in browser history, proxy logs and the support ticket screenshot."
covered_if = ["query string", "url", "logs", "logged", "plain text", "plaintext", "never shown", "masked"]
  [checks.test]
  title = "The password is not visible in the URL, the logs or an error message"
  category = "Negative"
  priority = "High"
  pre_conditions = "A user is signed in as user@example.com and the server log is readable"
  steps = ["Change the password and watch the address bar and the network tab", "Force a failure by sending a password the rules reject", "Search the server log and the error message for the password text"]
  expected_result = "The request uses POST with the password in the body only; neither the URL, the log lines nor the error text contains the password."
  test_data = "new=Harbour-Lantern-42"

[[risks]]
title = "Old sessions stay valid after a password change"
category = "security"
severity = 5
likelihood = 3
detectability = 3
effect = "Someone who already stole a session keeps the account after the owner changes the password."
cause = "The change updates the stored hash but never revokes the issued tokens."
covered_if = ["other sessions", "revoke", "sign out everywhere", "invalidate"]
