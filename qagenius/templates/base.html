<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}QA-Genius{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&amp;family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="/htmx.min.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo"><span class="logo-mark">✓</span>QA-Genius</div>
    <nav class="nav">
      <a href="/requirements/story" class="{% if active == 'requirements' %}active{% endif %}">Requirements</a>
      <a href="/bugs" class="{% if active == 'bugs' %}active{% endif %}">Bug desk</a>
      <a href="/insights" class="{% if active == 'insights' %}active{% endif %}">Quality insights</a>
      <a href="/performance" class="{% if active == 'performance' %}active{% endif %}">Performance</a>
    </nav>
  </aside>
    <div class="main">
    <header class="topbar"><span>{% block top_title %}QA-Genius{% endblock %}</span>
      <button id="key-chip" type="button" class="key-chip empty" aria-haspopup="dialog" aria-controls="keys-drawer">
        <span class="dot" hidden></span>
        <svg id="key-chip-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="4"/><path d="M11 11l8 8M16.5 16.5l2-2M18.5 18.5l-2-2"/></svg>
        <span id="key-chip-text">Add API key</span>
      </button>
    </header>
    <main class="content">{% block content %}{% endblock %}</main>
  </div>
</div>
{% include "_keys_drawer.html" %}
{% block scripts %}{% endblock %}
</body>
</html>
