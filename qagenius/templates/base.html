<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}QA-Genius{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&amp;family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="/htmx.min.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo"><span class="logo-mark">✓</span>QA-Genius</div>
    <nav class="nav">
      <a href="/requirements/story" class="{% if active == 'requirements' %}active{% endif %}">Requirements</a>
      <a href="/bugs" class="{% if active == 'bugs' %}active{% endif %}">Bug desk</a>
      <a href="/insights" class="{% if active == 'insights' %}active{% endif %}">Quality insights</a>
      <a href="/performance" class="{% if active == 'performance' %}active{% endif %}">Performance</a>
    </nav>
    <div class="side-bottom">
      <a href="/keys" class="{% if active == 'keys' %}active{% endif %}">Your API keys</a>
      <span id="key-status" class="pill warn">No key yet — examples only</span>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">{% block top_title %}QA-Genius{% endblock %}</header>
    <main class="content">{% block content %}{% endblock %}</main>
  </div>
</div>
</body>
</html>
