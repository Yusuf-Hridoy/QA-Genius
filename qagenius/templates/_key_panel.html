<div class="card key-panel" id="key-panel">
  <h2>Add your key to generate</h2>
  <p>Story check needs an AI key. Your key stays in this browser — our server never stores or logs it.</p>
  <ol>
    <li>Pick a provider and grab a free key.</li>
    <li>Paste it below and press <strong>Save and generate</strong>.</li>
    <li>Your story runs right away — no page reload.</li>
  </ol>
  <div class="field">
    <label for="panel-provider">Provider</label>
    <select id="panel-provider">
      {% for p in providers %}
      <option value="{{ p.id }}" data-key-url="{{ p.key_url }}">{{ p.name }}</option>
      {% endfor %}
    </select>
    <span class="hint"><a id="panel-key-link" href="{{ providers[0].key_url }}" target="_blank" rel="noopener">Get a free key</a></span>
  </div>
  <div class="field">
    <label for="panel-key">API key</label>
    <input type="password" id="panel-key" placeholder="Paste your key" autocomplete="off" spellcheck="false">
  </div>
  <button type="button" class="btn btn-primary" onclick="QAG.saveKeyAndResubmit('panel-provider', 'panel-key', 'story-form')">Save and generate</button>
</div>
<script>
(function () {
  var select = document.getElementById("panel-provider");
  var link = document.getElementById("panel-key-link");
  if (select && link) {
    select.addEventListener("change", function () {
      var opt = select.options[select.selectedIndex];
      if (opt && opt.dataset.keyUrl) {
        link.href = opt.dataset.keyUrl;
        link.textContent = "Get a free " + opt.textContent + " key";
      }
    });
  }
})();
</script>
