name: Keep Streamlit Alive

on:
  schedule:
    - cron: '*/10 * * * *'  # Runs every 10 minutes
  workflow_dispatch:         # Allows manual run too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          echo "Pinging app..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://testing-genius-suite.streamlit.app/)
          echo "Response code: $HTTP_CODE"
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "App did not respond with 200"
            exit 1
          fi
